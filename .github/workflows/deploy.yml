name: Deploy to GitHub Pages

# Build the Astro app and publish it to GitHub Pages via the official
# Pages artifact → deploy flow (introduced 2022, replaces the old
# `gh-pages` branch push pattern).
#
# Live URL: https://aakash-jain-1.github.io/kids-learning-games-astro/
#
# Trigger model — hard gate on Playwright tests:
#   The `build` job depends on a `test` job that runs the same
#   Playwright suite as `test.yml`. If `test` fails, `build` never
#   starts and the live site stays on whatever the previous deploy
#   shipped. test.yml continues to run independently for PR feedback
#   (this workflow doesn't run on PRs at all). T2.1 closed
#   2026-05-18 after the Counting Friends ship's red-tests / green-
#   deploy failure mode (commits 1a66542 → 825181f) demonstrated the
#   value of a hard gate concretely.
#
# Why test job is duplicated here vs test.yml:
#   First pass at this gate (commits dccf36d → 8428ae3) used a
#   `workflow_run` chain: deploy.yml triggered by test.yml's
#   successful completion. Two pushes confirmed the trigger never
#   fired — root cause unconfirmed (could be GitHub trigger-registry
#   indexing quirks for new workflow_run files, could be a subtle
#   YAML/filter mismatch I couldn't repro outside the prod repo).
#   Pivoted to consolidated approach in commit 9be0318+1: copy the
#   test job into deploy.yml, gate `build` on it via `needs: test`.
#   Same Playwright spec runs twice per main push (once in test.yml
#   for the badge + PR feedback path, once here for the deploy
#   gate); ~60s of duplicate compute is an acceptable trade vs
#   chasing a workflow_run misconfig that's invisible from the
#   outside. The duplication risk (test job here drifts from
#   test.yml) is low given both jobs are short and infrequently
#   touched.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy should run at a time. Newer runs cancel older
# in-progress ones so a rapid sequence of pushes doesn't stack up.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Playwright (chromium) — deploy gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'

      - name: Run Playwright tests
        run: npm test
        env:
          CI: 'true'
          ASTRO_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-deploy-gate
          path: playwright-report/
          retention-days: 14

  build:
    name: Build Astro site
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'

      - name: Type-check
        run: npx astro check
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'

      - name: Build
        run: npx astro build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'

      # Astro emits hashed assets under `dist/_astro/`. GitHub Pages runs
      # Jekyll by default, which hides any folder starting with `_` —
      # touching `.nojekyll` disables that behaviour.
      - name: Disable Jekyll on Pages
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
