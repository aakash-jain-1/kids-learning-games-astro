name: Playwright tests

# Smoke tests for the three shipped game layouts (card-machine / grid
# / story) plus per-game behaviour for Counting Friends and the quiz
# games. Runs against the production build via `astro preview`
# (Playwright's webServer config takes care of starting + tearing it
# down).
#
# Track 2 of post-migration polish — see `PROGRESS.md` → "Rough order
# of payoff" → item 4 (Add tests).
#
# Role today: independent test signal for the `Playwright tests`
# badge + per-PR test feedback. **Not the deploy gate** — the deploy
# gate is a separate copy of this same job inside `deploy.yml`,
# guarding `build` via `needs: test`. T2.1 closed 2026-05-18; first
# attempt was a `workflow_run` chain (commits dccf36d → 8428ae3)
# that never fired (GitHub trigger-registry quirks invisible from
# outside the repo); pivoted to the consolidated test-job-in-
# deploy.yml approach in commits 9be0318+1, which is what's live
# now. The duplication (test job in both files) means this workflow
# runs on every push to main *and* on every PR, while deploy.yml's
# copy only runs on push to main.
#
# History: was a soft gate from 2026-05-11 (Track 2 ship) through
# 2026-05-18; promoted after the Counting Friends ship demonstrated
# the failure mode concretely (commit 1a66542's tests went red but
# deploy went green, exposing users to a broken — though only
# narration-stalled — game until the hotfix in 825181f landed).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Don't queue duplicate runs; the latest commit's tests are the only
# ones that matter.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'

      - name: Run Playwright tests
        run: npm test
        env:
          CI: 'true'
          ASTRO_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
