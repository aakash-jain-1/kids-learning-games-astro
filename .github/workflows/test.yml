name: Playwright tests

# Smoke tests for the three shipped game layouts (card-machine / grid
# / story) plus per-game behaviour for Counting Friends and the quiz
# games. Runs against the production build via `astro preview`
# (Playwright's webServer config takes care of starting + tearing it
# down).
#
# Track 2 of post-migration polish — see `PROGRESS.md` → "Rough order
# of payoff" → item 4 (Add tests).
#
# Now a HARD deploy gate (closed T2.1 on 2026-05-18). `deploy.yml` is
# triggered by this workflow's successful completion on `main` via
# the `workflow_run` chain, NOT by push events directly. If this
# workflow goes red, the live site does NOT update. PRs see test
# results as PR checks but never trigger a deploy (deploy.yml only
# triggers off main-branch workflow_run events). Note that
# `workflow_dispatch` on deploy.yml is still available as an
# emergency manual-deploy escape hatch that skips the gate.
#
# History: was a soft gate from 2026-05-11 (Track 2 ship) through
# 2026-05-18; promoted after the Counting Friends ship demonstrated
# the failure mode concretely (commit 1a66542's tests went red but
# deploy went green, exposing users to a broken — though only
# narration-stalled — game until the hotfix in 825181f landed).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Don't queue duplicate runs; the latest commit's tests are the only
# ones that matter.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'

      - name: Run Playwright tests
        run: npm test
        env:
          CI: 'true'
          ASTRO_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
